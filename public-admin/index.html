<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BARBER STATUS — Админ-сайт</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Админ-сайт BARBER STATUS</h1>
    <p>Отдельный сайт для администратора. Здесь видны все новые заявки.</p>

    <div class="admin-auth">
      <input type="password" id="adminPassword" placeholder="Пароль администратора" />
      <button class="btn" id="loadBookingsBtn">Загрузить заявки</button>
    </div>

    <p id="adminMessage" class="form-message" role="status"></p>

    <section>
      <h2>Заявки</h2>
      <div id="bookingsList" class="bookings-list"></div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
