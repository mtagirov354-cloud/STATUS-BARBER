services:
  status-barber:
    build: .
    container_name: status-barber
    restart: unless-stopped
    environment:
      CLIENT_HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      CLIENT_PORT: 3000
      ADMIN_PORT: 3001
      ADMIN_PASSWORD: BARBERSTATUSADM
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./data:/app/data
